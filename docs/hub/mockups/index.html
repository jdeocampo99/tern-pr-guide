<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PR hub mockups</title>
<link rel="stylesheet" href="../../tern-tokens.css">
<link rel="stylesheet" href="../../../guide.css">
<style>
/* Tern window (mockup frame; Tern draws this) */
html, body { margin: 0; height: 100%; }
body { font: 400 14px/1.5 var(--sans); color: var(--t1); background: var(--page); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
.app { height: 100%; gap: 0; }
.tabbar { flex-shrink: 0; height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 12px 0 84px; font-size: 13px; color: var(--t2); }
.tab { padding: 5px 12px; border-radius: var(--r-ctl); white-space: nowrap; }
.tab-on { background: var(--l2); color: var(--t1); }
.win { flex-grow: 1; min-height: 0; display: flex; gap: 6px; padding: 0 6px; }
.pane { min-width: 0; border-radius: 11px; background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
.pane-hub { flex-grow: 1; }
.pane-term { flex-grow: 1; background: var(--tv-bg); color: var(--tv-fg); font: 13px/1.6 var(--tv-font); padding: 18px 20px; }
.pane-term .dim { color: var(--t3); }
body:not(.split) .pane-term { display: none; }
body.split .pane-hub { flex-grow: 0; width: 720px; flex-shrink: 0; }
.statusline { flex-shrink: 0; height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 12px; font-size: 12px; color: var(--t3); }
.sl-seg { padding: 2px 8px; border-radius: var(--r-chip); white-space: nowrap; }
.sl-pr { color: var(--t1); background: var(--chip-bg); display: flex; gap: 6px; align-items: center; }
.sl-pr i { width: 6px; height: 6px; border-radius: 3px; background: var(--gp-blue); }
/* the hub's segment flashes red when a PR newly needs fixes, then settles */
.sl-pr.bump { animation: sl-bump 1600ms ease; }
@keyframes sl-bump { from { background: var(--gp-danger-wash); box-shadow: inset 0 0 0 1px var(--gp-danger-wash-line); } to { background: var(--chip-bg); box-shadow: none; } }
/* a PR arriving in Needs fixes: a red ring that fades, instead of the green wash good news gets */
.f-arrive.f-arrive-bad { animation: f-arrive var(--gp-dur-unroll) var(--gp-ease-out), f-ring 1600ms ease; }
@keyframes f-ring { from { box-shadow: 0 0 0 3px rgb(from var(--gp-removed) r g b / 45%); } to { box-shadow: 0 0 0 0 rgb(from var(--gp-removed) r g b / 0%); } }
@media (prefers-reduced-motion: reduce) { .f-arrive.f-arrive-bad { animation: gp-fade-in var(--gp-dur-in) ease, f-ring 1600ms ease; } }
.f-toast .bad { font-size: 9px; color: var(--gp-removed); }
.sl-sp { flex-grow: 1; }

/* mockup controls (not product) */
.mock { position: fixed; top: 6px; right: 10px; z-index: 50; display: flex; gap: 6px; align-items: center; padding: 3px 4px 3px 10px; border-radius: var(--r-ctl); border: 1px dashed var(--l4); background: var(--pop-bg); font-size: 12px; color: var(--t3); }
.mseg { display: flex; gap: 2px; padding: 2px; border-radius: var(--r-ctl); background: var(--chip-bg); }
.mseg button { border: 0; background: transparent; padding: 2px 9px; border-radius: var(--r-chip); cursor: pointer; font-size: 12px; font-weight: 600; color: var(--t3); }
.mseg .on { background: var(--card); color: var(--t1); box-shadow: 0 1px 2px light-dark(rgba(16,24,40,0.12), rgba(0,0,0,0.4)); }

/* hub page */
.hub { flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; scroll-padding: 150px 0 60px; }
.hub > * { flex-shrink: 0; }
.hb-head { padding: 14px 20px 12px; }
.hb-head.has-tabs { padding-bottom: 0; border-bottom: 0; gap: 12px; }
.hb-top { display: flex; align-items: center; gap: 16px; }
.hb-tabs { display: flex; align-items: flex-end; gap: 12px; margin: 0 -20px; padding: 0 20px; box-shadow: inset 0 -1px 0 var(--l2); }
.hb-tabs .sf-tabs { box-shadow: none; flex-shrink: 0; }
.hb-tabs .sf-tab { height: 34px; font-size: 13px; }
body.split .gp-hb-mode { display: none; }
.gp-hintbar { overflow: hidden; }
.gp-hb-mode { white-space: nowrap; }
.t-pill { margin-left: 7px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 650; line-height: 16px; color: #fff; font-variant-numeric: tabular-nums; }
.t-pill-blue { background: var(--gp-blue-fill); }
.hb-title { font-size: 21px; font-weight: 650; white-space: nowrap; }
.hb-top .gp-sr-box { flex-grow: 1; max-width: 560px; border-color: var(--l3); padding: 5px 10px; }
.hb-top input { flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--t1); caret-color: var(--gp-blue); }
.hb-top input::placeholder { color: var(--t3); }
.hb-top .gp-sr-box:focus-within { border-color: var(--gp-blue-line); }
.hb-fresh { margin-left: auto; display: flex; gap: 8px; align-items: center; font-size: 12.5px; color: var(--t3); white-space: nowrap; }
/* view controls (filter, sort) sit at the right of the tabs; the agent model is a setting, so it sits in the header */
.hb-tabs .hb-ctls { margin-left: auto; }
.hb-fresh .hb-ctls { margin-left: 4px; }
.hb-fresh .hb-ctl { color: var(--t3); }
.hb-body { flex-grow: 1; padding: 16px 20px 8px; display: flex; flex-direction: column; gap: 24px; }
.hb-body > * { flex-shrink: 0; }
.gp-hintbar { margin-top: 0; }
::selection { background: light-dark(rgba(47,111,224,0.18), rgba(138,180,255,0.28)); }

/* section heading: label, count, optional note */
.hb-h { display: flex; gap: 8px; align-items: baseline; padding: 0 10px 6px; }
.hb-h .gp-panel-h { color: var(--t2); }
.hb-n { font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }
.hb-note { font-size: 12.5px; color: var(--t3); }

/* rows: hover and selected come from the existing search row (gp-sr-row, gp-sr-row-on) */
.hb-row { display: flex; gap: 12px; align-items: baseline; padding: 7px 10px; border-radius: var(--r-ctl); cursor: pointer; }
.hb-row.gp-sr-row-on .hb-title-t { color: var(--gp-blue-ink); }
.hb-verb { font-size: 13px; font-weight: 650; white-space: nowrap; }
.v-blue { color: var(--gp-blue); }
.hb-top .gp-sr-box .kbd { font-size: 10.5px; }
.hb-top .gp-sr-slash { font-size: 17px; line-height: 1; }
.v-red { color: var(--gp-removed); }
.v-green { color: var(--gp-added); }
.v-wait { color: var(--t2); font-weight: 500; }
.v-idle { color: var(--t3); font-weight: 500; }
.hb-why { font-size: 13px; color: var(--t2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hb-title-t { font-size: 14px; color: var(--t1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hb-meta { font: 12px/1.4 var(--tv-font); color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.hb-num { font: 12.5px var(--tv-font); color: var(--t3); flex-shrink: 0; font-variant-numeric: tabular-nums; }
.hb-ci { flex-shrink: 0; font: 12px var(--tv-font); color: var(--t3); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ci-ok { color: var(--gp-added); } .ci-bad { color: var(--gp-removed); }
.hb-age { flex-shrink: 0; width: 34px; text-align: right; font: 12px var(--tv-font); color: var(--t3); font-variant-numeric: tabular-nums; }

/* stacked row: what to do, which PR, where */
.hb-stack { flex-direction: column; gap: 1px; align-items: stretch; }
.hb-stack .hb-l1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.hb-stack .hb-l3 { display: flex; gap: 10px; align-items: baseline; }
.hb-stack .hb-l3 .hb-meta { flex-grow: 1; }

/* inactive fold */
.hb-fold { display: flex; gap: 10px; align-items: baseline; padding: 8px 10px; border-radius: var(--r-ctl); cursor: pointer; border: 1px dashed var(--l3); }
.hb-fold .gp-panel-h { color: var(--t2); }
.hb-fold .chev { font-size: 11px; color: var(--t3); width: 10px; display: inline-block; transition: transform var(--gp-dur-in) var(--gp-ease-out); }
.hb-fold.open .chev { transform: rotate(90deg); }
.hb-fold-rows { display: flex; flex-direction: column; gap: 1px; padding-top: 4px; animation: hb-in var(--gp-dur-in) var(--gp-ease-out); }
@keyframes hb-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
.hb-quiet .hb-title-t { color: var(--t2); }

/* line row with fixed columns (G's Created lane, H) */
.hb-line .hb-num { width: 44px; }
.hb-line .hb-title-t { flex: 1 1 auto; }
.hb-line .hb-state { flex: 0 0 270px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-line .hb-ci { width: 52px; }
.hb-line .hb-verbcol { flex: 0 0 132px; }
.hb-line .hb-repo { flex: 0 0 120px; font: 12px var(--tv-font); color: var(--t3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-sub { display: flex; gap: 8px; align-items: baseline; padding: 10px 10px 2px; font: 12.5px var(--tv-font); color: var(--t2); }
.hb-sub span { color: var(--t3); }

/* F: one board per process behind tabs (Your pull requests, Reviewing). Each runs left to right: your turn
   (colored), their turn (neutral), done (green). Your-turn cards carry their meaning as a wash (blue: a review
   is owed, red: your PR needs work) and Waiting stays quieter in type. */
.f-board { display: flex; gap: 24px; align-items: flex-start; }
.f-col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.f-col.f-act { flex-grow: 1.35; }
.f-h { display: flex; gap: 8px; align-items: center; padding: 0 2px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--l2); }
.f-h-t { font-size: 15px; font-weight: 650; color: var(--t1); }
.f-pill { padding: 0 7px; border-radius: 10px; font-size: 12px; font-weight: 650; line-height: 18px; font-variant-numeric: tabular-nums; color: var(--t2); background: var(--chip-bg); }
.f-act .f-h { border-bottom-color: var(--gp-blue-wash-line); }
.f-act .f-pill { color: #fff; background: var(--gp-blue-fill); }
.f-ready .f-h { border-bottom-color: var(--gp-success-wash-line); }
.f-ready .f-pill { color: var(--gp-added); background: var(--gp-success-wash); }
.f-wait .f-h-t { color: var(--t2); }
.f-chip { flex-shrink: 0; padding: 0 7px; border-radius: var(--r-chip); font-size: 12px; font-weight: 650; line-height: 19px; white-space: nowrap; }

/* every PR is a box: neutral by default, washed by meaning in the your-turn column, green-edged when done */
.f-col .hb-stack, .f-col .f-rrow { border: 1px solid var(--l2); border-radius: var(--r-ctl); background: var(--sf-shade); transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease; }
.f-col .hb-row.gp-sr-row-on, .f-col .hb-row.gp-sr-row-on:hover { border-color: var(--gp-blue-line); box-shadow: 0 0 0 1px var(--gp-blue-line); }
@media (hover: hover) and (pointer: fine) {
  .f-wait .hb-stack:hover { background: var(--l1); border-color: var(--l3); }
  .f-ready .f-rrow:hover { background: var(--l1); }
}

/* Needs action: one washed card per PR */
.f-act .hb-stack { gap: 5px; padding: 12px 16px 11px; border: 1px solid; border-radius: var(--r-ctl); transition: border-color 140ms ease, box-shadow 140ms ease; }
.f-act .t-blue { background: var(--gp-blue-wash); border-color: var(--gp-blue-wash-line); }
.f-act .t-red { background: var(--gp-danger-wash); border-color: var(--gp-danger-wash-line); }
.f-act .t-blue .f-chip { color: #fff; background: var(--gp-blue-fill); }
.f-act .t-red .f-chip { color: #fff; background: var(--gp-danger-fill); }
.f-act .hb-why { font-size: 13px; font-weight: 500; }
.f-act .t-blue .hb-why { color: var(--gp-blue-ink); }
.f-act .t-red .hb-why { color: var(--gp-danger-text); }
.f-act .hb-title-t { font-size: 15px; font-weight: 600; line-height: 1.35; white-space: normal; }
.f-act .hb-meta, .f-act .hb-age, .f-act .hb-ci:not(.ci-ok):not(.ci-bad) { color: var(--t2); }
.f-act .t-blue.gp-sr-row-on, .f-act .t-blue.gp-sr-row-on:hover { background: var(--gp-blue-wash); box-shadow: 0 0 0 1px var(--gp-blue-line); border-color: var(--gp-blue-line); }
.f-act .t-red.gp-sr-row-on, .f-act .t-red.gp-sr-row-on:hover { background: var(--gp-danger-wash); box-shadow: 0 0 0 1px var(--gp-blue-line); border-color: var(--gp-blue-line); }
.f-act .gp-sr-row-on .hb-title-t { color: var(--t1); }
@media (hover: hover) and (pointer: fine) {
  .f-act .t-blue:hover { background: var(--gp-blue-wash); border-color: var(--gp-blue-line); }
  .f-act .t-red:hover { background: var(--gp-danger-wash); border-color: rgb(from var(--gp-removed) r g b / 55%); }
}

/* Ready to merge: a green check in the gutter; the column heading already says Merge */
.f-rrow { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px 10px 14px; }
.f-ready .f-rrow { border-color: var(--gp-success-wash-line); }
.f-ok { flex-shrink: 0; width: 14px; font-size: 13px; font-weight: 700; line-height: 20px; color: var(--gp-added); }
.f-rmain { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.f-rmain .hb-l3 { display: flex; gap: 10px; align-items: baseline; }
.f-rmain .hb-meta { flex-grow: 1; }
.f-ready .hb-title-t { font-size: 14px; font-weight: 500; }

/* Waiting: the reason only, in quieter type */
.f-wait .hb-stack { gap: 4px; padding: 11px 16px 10px; }
.f-wait .hb-title-t { font-size: 13.5px; color: var(--t2); }
.f-mine .f-act .f-h { border-bottom-color: var(--gp-danger-wash-line); }
.f-mine .f-act .f-pill { background: var(--gp-danger-fill); }
.f-av { flex-shrink: 0; width: 22px; height: 22px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font: 650 10px/1 var(--sans); color: var(--t1); background: var(--raise); box-shadow: inset 0 0 0 1px var(--l3); }
.f-av-sm { width: 16px; height: 16px; font-size: 8px; }
.hb-l3 .f-av-sm { align-self: center; margin-right: -4px; }
body.split .f-board { flex-direction: column; gap: 20px; align-items: stretch; }

/* checks: one mark and a muted count, as GitHub shows them. Passed is a green check, failed a red cross,
   running an amber spinner: the board's one moving thing, the plugin's loading spinner (gp-st-spin) in amber. */
.ci-m { flex-shrink: 0; display: inline-flex; gap: 5px; align-items: center; font: 11.5px var(--tv-font); color: var(--t3); font-variant-numeric: tabular-nums; }
.ci-g { font-family: var(--sans); font-size: 12px; font-weight: 700; line-height: 1; }
.ci-m.ok .ci-g { color: var(--gp-added); }
.ci-m.bad, .ci-m.bad .ci-g { color: var(--gp-removed); }
.ci-spin { flex-shrink: 0; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--l3); border-top-color: var(--gp-changed); animation: gp-spin 800ms linear infinite; }
.ci-spin.out { opacity: 0; transform: scale(0.6); filter: blur(2px); animation-play-state: paused; transition: opacity var(--gp-dur-out) var(--gp-ease-out), transform var(--gp-dur-out) var(--gp-ease-out), filter var(--gp-dur-out) var(--gp-ease-out); }
.ci-pop .ci-g { display: inline-block; animation: ci-pop var(--gp-dur-in) var(--gp-ease-out); }
@keyframes ci-pop { from { opacity: 0; transform: scale(0.6); filter: blur(2px); } to { opacity: 1; transform: none; filter: none; } }

/* status chips for the waiting columns: who or what the PR waits on, in one or two words */
.st { flex-shrink: 0; display: inline-flex; gap: 6px; align-items: center; padding: 0 7px; border-radius: var(--r-chip); font-size: 12px; font-weight: 600; line-height: 20px; white-space: nowrap; }
.st-run .ci-spin { width: 9px; height: 9px; }
.st-purple { color: var(--gp-suggestion); background: rgb(from var(--gp-suggestion) r g b / 12%); }
.st-purple b { font-weight: 500; opacity: 0.85; }
.st-red { color: var(--gp-danger-text); background: var(--gp-danger-wash); }
.st-neutral { color: var(--t2); background: var(--chip-bg); }
.f-h-note { margin-left: auto; font-size: 12px; }

/* filter and sort: quiet buttons in the tab row; a menu opens under its button, in Tern's popover look */
.hb-ctls { position: relative; align-self: center; display: flex; gap: 4px; align-items: center; margin-left: 12px; }
.hb-ctl { display: flex; gap: 6px; align-items: center; padding: 3px 6px 3px 9px; border: 1px solid transparent; border-radius: var(--r-ctl); background: transparent; font-size: 12.5px; color: var(--t2); cursor: pointer; white-space: nowrap; transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform var(--gp-dur-press) var(--gp-ease-out); }
.hb-ctl b { font-weight: 600; color: var(--t1); }
.hb-ctl .chev { font-size: 9px; color: var(--t3); }
.hb-ctl .kbd { margin-left: 2px; }
.hb-ctl:active { transform: scale(0.97); }
.hb-ctl.open { background: var(--l1); border-color: var(--l3); color: var(--t1); }
.hb-ctl.act { background: var(--gp-blue-wash); border-color: var(--gp-blue-wash-line); color: var(--gp-blue-ink); }
.hb-ctl.act b { color: var(--gp-blue-ink); }
@media (hover: hover) and (pointer: fine) { .hb-ctl:hover { background: var(--l1); color: var(--t1); } .hb-ctl.act:hover { background: var(--gp-blue-wash); } }
.hb-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; min-width: 300px; padding: 6px; display: flex; flex-direction: column; gap: 1px; border-radius: var(--r-card); background: var(--card); box-shadow: inset 0 0 0 1px var(--l3), 0 1px 2px light-dark(rgba(20, 30, 60, 0.06), rgba(0, 0, 0, 0.5)), 0 16px 40px -18px light-dark(rgba(30, 42, 90, 0.3), rgba(0, 0, 0, 0.7)); transform-origin: top right; }
.hb-pop.anim { animation: hb-pop-in var(--gp-dur-in) var(--gp-ease-out); }
@keyframes hb-pop-in { from { opacity: 0; transform: scale(0.97) translateY(-2px); } to { opacity: 1; transform: none; } }
.hb-pop-h { padding: 6px 8px 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--t3); }
.hb-opt { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: var(--r-ctl); font-size: 13px; color: var(--t1); cursor: pointer; white-space: nowrap; }
.hb-opt.hl { background: var(--l1); }
@media (hover: hover) and (pointer: fine) { .hb-opt:hover { background: var(--l1); } }
.hb-opt .box { flex-shrink: 0; width: 14px; height: 14px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; color: transparent; box-shadow: inset 0 0 0 1.5px var(--t4); }
.hb-opt.on .box { color: #fff; background: var(--gp-blue-fill); box-shadow: none; }
.hb-opt .tick { flex-shrink: 0; width: 14px; font-size: 12px; font-weight: 700; color: var(--gp-blue); text-align: center; }
.hb-opt .cnt { margin-left: auto; font: 11.5px var(--tv-font); color: var(--t3); font-variant-numeric: tabular-nums; }
.hb-opt .sub { margin-left: auto; padding-left: 16px; font-size: 12px; color: var(--t3); }
.hb-opt.clear { color: var(--t2); }
.hb-pop hr { height: 1px; margin: 4px 2px; border: 0; background: var(--l2); }
/* sorted by repository: each column's PRs sit under their repository */
.f-repo { display: flex; gap: 8px; align-items: baseline; padding: 10px 2px 2px; font: 12px var(--tv-font); color: var(--t2); }
.f-repo:first-of-type { padding-top: 2px; }
.f-repo span { color: var(--t3); }

/* a PR changing columns: the old row fades out fast, the new one arrives with a green wash that fades */
.f-leave { opacity: 0; transform: translateX(6px); transition: opacity var(--gp-dur-out) var(--gp-ease-out), transform var(--gp-dur-out) var(--gp-ease-out); }
.f-arrive { animation: f-arrive var(--gp-dur-unroll) var(--gp-ease-out), f-flash 1600ms ease; }
@keyframes f-arrive { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }
@keyframes f-flash { from { background-color: var(--gp-success-wash); } to { background-color: transparent; } }

/* G: two lanes by role */
.g-lanes { display: flex; gap: 24px; align-items: flex-start; }
.g-rev { flex: 0 0 360px; display: flex; flex-direction: column; gap: 2px; padding: 12px 8px 8px; border: 1px solid var(--l2); border-radius: var(--r-card); background: var(--sf-shade); }
.g-mine { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.g-mine .hb-h { padding-bottom: 4px; }
body.split .g-lanes { flex-direction: column; align-items: stretch; }
body.split .g-rev { flex-basis: auto; }
body.split .hb-line .hb-state { flex-basis: 170px; }
body.split .h-main .hb-state { display: none; }
body.split .hb-line .hb-verbcol { flex-basis: 120px; }

/* H: repo rail */
.h-split { display: flex; gap: 24px; align-items: flex-start; }
.h-rail { flex: 0 0 210px; position: sticky; top: 0; display: flex; flex-direction: column; gap: 1px; }
.h-rail .gp-panel-h { padding: 12px 10px 4px; }
.h-item { display: flex; gap: 8px; align-items: baseline; padding: 5px 10px; border-radius: var(--r-ctl); cursor: pointer; font-size: 13.5px; color: var(--t2); }

    if (e.key === 'Escape') { e.preventDefault(); ACT.methodClose(); return; }
    if (e.key === 'Enter') { e.preventDefault(); ACT.methodSave(mp); return; }
    if (inField) return;
    if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); M.hl = Math.max(0, Math.min(KINDS.length - 1, M.hl + (e.key === 'ArrowDown' || e.key === 'j' ? 1 : -1))); M.kind = KINDS[M.hl][0]; render(); return; }
    if (e.key === 'Tab') { e.preventDefault(); hub.querySelector('[data-field]')?.focus(); return; }
    return;
  }
  if (S.menu) {
    const items = menuItems(S.menu.kind);
    if (e.key === 'Escape') { S.menu = null; render(); return; }
    if (S.menu.kind === 'agent' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { e.preventDefault(); const fx = MODELS[S.menu.hl >= 0 ? S.menu.hl : S.model][2], j = fx.indexOf(S.effort); if (fx.length) S.effort = fx[Math.max(0, Math.min(fx.length - 1, j + (e.key === 'ArrowRight' ? 1 : -1)))]; render(); return; }
    if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); S.menu.hl = Math.min(items.length - 1, S.menu.hl + 1); render(); return; }
    if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); S.menu.hl = Math.max(0, S.menu.hl - 1); render(); return; }
    if ((e.key === 'Enter' || e.key === ' ') && S.menu.hl >= 0) { e.preventDefault(); items[S.menu.hl].run(); if (S.menu) S.menu.hl = Math.min(S.menu.hl, menuItems(S.menu.kind).length - 1); S.sel = null; render(); return; }
  }
  const p = S.sel && prs.find(x => key(x) === S.sel), A = p?.agent;
  if ((e.key === '?' && !inQ) || (S.help && e.key === 'Escape')) { S.help = !S.help && e.key === '?'; render(); return; }
  if (S.help) return;
  if (e.key === 'Escape') { if (S.confirm || S.discard || S.ask || S.batch) { ACT.cancel(); return; } if (S.marked.size) { ACT.clearMarks(); return; } if (inQ) { document.activeElement.blur(); if (S.q) { S.q = ''; render(); } } return; }
  if (e.key === 'Enter' && e.metaKey && S.batch) { e.preventDefault(); ACT.batchGo(); return; }
  if (e.key === 'Enter' && e.metaKey && S.ask) { e.preventDefault(); ACT.useLearned(prs.find(x => key(x) === S.ask)); return; }
  if (e.key === 'Enter' && e.metaKey && S.discard) { e.preventDefault(); ACT.discardOk(prs.find(x => key(x) === S.discard)); return; }
  if (e.key === 'Enter' && e.metaKey && S.confirm) { e.preventDefault(); merge(prs.find(x => key(x) === S.confirm)); return; }
  if (S.v === 'F' && !inQ && !e.metaKey && !e.ctrlKey && e.key === 'n') { e.preventDefault(); S.tab = 'rev'; S.menu = null; render(); document.getElementById('addq')?.focus(); return; }
  if (inQ && !['ArrowDown', 'ArrowUp', 'Enter'].includes(e.key)) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const rs = rows().map(r => r.dataset.row), i = rs.indexOf(S.sel);
  const dir = { ArrowDown: 'down', j: 'down', ArrowUp: 'up', k: 'up', ArrowLeft: 'left', h: 'left', ArrowRight: 'right', l: 'right' }[e.key];
  if (S.v === 'F' && dir) { e.preventDefault(); if (inQ) document.activeElement.blur(); nav(dir); }
  else if (e.key === 'ArrowDown' || e.key === 'j') { e.preventDefault(); if (inQ) document.activeElement.blur(); select(rs[Math.min(rs.length - 1, i + 1)] ?? rs[0]); }
  else if (e.key === 'ArrowUp' || e.key === 'k') { e.preventDefault(); select(rs[Math.max(0, i - 1)] ?? rs[0]); }
  else if (e.key === 'Enter' && A?.st === 'ready') ACT.review(p);
  else if (e.key === 'Enter' && S.sel) open(S.sel);
  else if (S.v === 'F' && e.key === '.') goNext();
  else if (S.v === 'F' && p && e.key === ' ') { e.preventDefault(); toggleMark(p); }
  else if (S.v === 'F' && e.key === 'm' && markedIn('ready').length) ACT.batchMerge();
  else if (S.v === 'F' && e.key === 'x' && markedIn('idle').length) ACT.batchClose();
  else if (S.v === 'F' && e.key === 'X') ACT.closeAll();
  else if (S.v === 'F' && p && e.key === 'u' && p.behind) ACT.update(p);
  else if (S.v === 'F' && e.key === 'M') { S.menu = S.menu?.kind === 'agent' ? null : { kind: 'agent', hl: S.model, anim: false }; render(); }
  else if (S.v === 'F' && p && e.key === 'm' && p.s.b === 'ready' && !p.merging) p.queued?.st === 'queued' ? ACT.dequeue(p) : !p.queued && ACT.merge(p);
  else if (S.v === 'F' && p && e.key === ',' && p.s.b === 'ready' && !p.queued) ACT.method(p);
  else if (S.v === 'F' && p && e.key === 'c') ACT.copy(p);
  else if (S.v === 'F' && p && e.key === 'x' && p.state === 'added') ACT.unadd(p);
  else if (S.v === 'F' && p && p.role === 'mine' && (p.s.b === 'act' || (p.s.b === 'wait' && (p.bot || A))) && ['a', 'A', 'p', 'd', 'o'].includes(e.key)) {
    if (e.key === 'a') A?.st === 'clone' ? ACT.clone(p) : A?.st === 'ready' || A?.st === 'reviewed' ? null : fixable(p).length || A || p.bot ? ACT.agent(p) : hasReply(p) && !p.summary && summarize(p);
    else if (e.key === 'A' && fixable(p).length && hasReply(p) && !p.summary) summarize(p);
    else if (e.key === 'p' && A?.st === 'reviewed') ACT.push(p);
    else if (e.key === 'd' && (A?.st === 'ready' || A?.st === 'reviewed')) ACT.discard(p);
    else if (e.key === 'o' && A?.st === 'fail') ACT.worktree(p);
    else if (e.key === 'o' && A?.st === 'clone') ACT.folder(p);
  }
  else if (S.v === 'H' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { const ids = [...hub.querySelectorAll('[data-rail]')].map(x => x.dataset.rail); const j = ids.indexOf(S.rail); S.rail = ids[(j + (e.key === 'ArrowRight' ? 1 : ids.length - 1)) % ids.length]; S.sel = null; render(); }
  else if (S.v === 'F' && e.key === 't') { S.tab = S.tab === 'rev' ? 'mine' : 'rev'; S.sel = null; S.menu = null; render(); }
  else if (S.v === 'F' && (e.key === 'f' || e.key === 's')) { const kind = e.key === 'f' ? 'repo' : 'sort'; S.menu = S.menu?.kind === kind ? null : { kind, hl: 0, anim: false }; render(); }
  else if (e.key === 'v') { const ks = Object.keys(VARIANTS); S.v = ks[(ks.indexOf(S.v) + 1) % ks.length]; S.sel = null; render(); }
});
/* the running agent's elapsed time, updated in place so its spinner and bar keep running */
setInterval(() => document.querySelectorAll('[data-t0]').forEach(el => { el.textContent = clock(+el.dataset.t0); }), 1000);
render();
</script>
