# While any PR has running checks: poll only those PRs every 30 s. Measured 1 point, 1-1.5 s, for 5 or 40 PRs.
query Checks($ids: [ID!]!) {
  rateLimit { cost remaining }
  nodes(ids: $ids) { ... on PullRequest { number headRefOid commits(last: 1) { nodes { commit { statusCheckRollup { state contexts(first: 0) { checkRunCountsByState { state count } statusContextCountsByState { state count } } } } } } } }
}
